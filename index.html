<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>A Question For You 💌</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        /* ====================================================
     EDIT ME: quick customization variables
     ==================================================== */
        :root {
            --blush: #ffd6e8;
            --rose: #ff8fab;
            --berry: #c9184a;
            --cream: #fff7fa;
            --lavender: #b892ff;
            --plum: #4a1942;
            --gold: #ffd166;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Quicksand', sans-serif;
            background: radial-gradient(circle at 20% 20%, var(--blush), var(--cream) 55%),
                linear-gradient(160deg, var(--cream), var(--blush));
            color: var(--plum);
            overflow: hidden;
            touch-action: manipulation;
        }

        #hearts {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .float-heart {
            position: absolute;
            bottom: -10%;
            font-size: 1.4rem;
            opacity: .55;
            animation: rise linear infinite;
            filter: drop-shadow(0 2px 2px rgba(201, 24, 74, .15));
        }

        @keyframes rise {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: .6;
            }

            100% {
                transform: translateY(-115vh) translateX(var(--drift, 20px)) rotate(360deg);
                opacity: 0;
            }
        }

        .stage {
            position: relative;
            z-index: 2;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            position: relative;
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, .72);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, .9);
            border-radius: 28px;
            padding: 40px 28px 34px;
            text-align: center;
            box-shadow: 0 25px 60px -20px rgba(201, 24, 74, .35);
            animation: pop-in .6s cubic-bezier(.2, 1.4, .4, 1) both;
        }

        @keyframes pop-in {
            from {
                opacity: 0;
                transform: translateY(24px) scale(.94);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .eyebrow {
            font-family: 'Fredoka', sans-serif;
            letter-spacing: .14em;
            text-transform: uppercase;
            font-size: .68rem;
            color: var(--berry);
            font-weight: 600;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: clamp(1.5rem, 6vw, 2.05rem);
            line-height: 1.25;
            margin: 0 0 8px;
            color: var(--plum);
        }

        .sub {
            font-size: .95rem;
            color: #7a4a63;
            margin: 0 0 26px;
            min-height: 1.4em;
            transition: opacity .2s ease;
        }

        .btn-row {
            position: relative;
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
            min-height: 64px;
        }

        button {
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            border: none;
            cursor: pointer;
            border-radius: 999px;
            font-size: 1.02rem;
            padding: 14px 30px;
            transition: transform .18s ease, box-shadow .18s ease, background .2s ease;
        }

        #yesBtn {
            background: linear-gradient(135deg, var(--rose), var(--berry));
            color: #fff;
            box-shadow: 0 10px 24px -8px rgba(201, 24, 74, .55);
            transform: scale(var(--yes-scale, 1));
        }

        #yesBtn:hover {
            transform: scale(calc(var(--yes-scale, 1) * 1.05));
        }

        #yesBtn:active {
            transform: scale(calc(var(--yes-scale, 1) * .96));
        }

        #noBtn {
            background: #fff;
            color: var(--berry);
            border: 2px solid var(--rose);
            position: relative;
            z-index: 5;
        }

        #noBtn.roaming {
            position: fixed;
            z-index: 50;
        }

        .attempts {
            margin-top: 18px;
            font-size: .78rem;
            color: #a86a83;
            letter-spacing: .02em;
            min-height: 1em;
        }

        /* ---------- crying character ---------- */
        #crier {
            position: fixed;
            z-index: 60;
            font-size: 2.6rem;
            left: 0;
            top: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity .25s ease;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .15));
        }

        #crier.show {
            opacity: 1;
        }

        #crier .bubble {
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            color: var(--plum);
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            font-size: .72rem;
            padding: 5px 10px;
            border-radius: 12px;
            white-space: nowrap;
            box-shadow: 0 6px 14px rgba(0, 0, 0, .12);
        }

        /* ---------- yes / reveal screen ---------- */
        .reveal {
            display: none;
            text-align: center;
        }

        .reveal.show {
            display: block;
        }

        .reveal h1 {
            font-size: clamp(2rem, 9vw, 2.8rem);
            background: linear-gradient(135deg, var(--berry), var(--lavender));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: heart-pulse 1.4s ease-in-out infinite;
        }

        @keyframes heart-pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }
        }

        #videoWrap {
            margin-top: 20px;
            width: 100%;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 18px;
            overflow: hidden;
            background: #1a0f16;
            box-shadow: 0 16px 40px -14px rgba(74, 25, 66, .5);
        }

        #videoWrap:empty {
            display: none;
        }

        .embed-16x9 {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            /* 16:9 */
        }

        .embed-16x9 iframe,
        .embed-16x9 video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .video-hint {
            margin-top: 14px;
            font-size: .78rem;
            color: #a86a83;
            line-height: 1.5;
        }

        .burst {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 40;
        }

        .burst span {
            position: absolute;
            font-size: 1.4rem;
            animation: burst-fly 1.1s ease-out forwards;
        }

        @keyframes burst-fly {
            0% {
                transform: translate(0, 0) scale(.4);
                opacity: 1;
            }

            100% {
                transform: translate(var(--bx), var(--by)) scale(1);
                opacity: 0;
            }
        }

        .dropfall {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 40;
        }

        .dropfall span {
            position: absolute;
            top: -10%;
            font-size: 1.8rem;
            animation: drop-down linear forwards;
        }

        @keyframes drop-down {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            85% {
                opacity: 1;
            }

            100% {
                transform: translateY(115vh) rotate(var(--spin, 220deg));
                opacity: 0;
            }
        }

        @media (max-width:380px) {
            .card {
                padding: 32px 20px 28px;
            }

            button {
                padding: 13px 22px;
                font-size: .95rem;
            }

            .btn-row {
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <div id="hearts"></div>

    <div class="stage">
        <div class="card" id="card">

            <!-- ============ QUESTION SCREEN ============ -->
            <div id="askScreen">
                <div class="eyebrow">A very important question</div>
                <!-- EDIT ME: swap in her name -->
                <h1 id="question">Hey You 🌸<br>Will you be my girlfriend?</h1>
                <p class="sub" id="subtext">Choose wisely...</p>

                <div class="btn-row" id="btnRow">
                    <button id="yesBtn">Yes 💖</button>
                    <button id="noBtn">No</button>
                </div>

                <div class="attempts" id="attemptsText"></div>
            </div>

            <!-- ============ YES / REVEAL SCREEN ============ -->
            <div class="reveal" id="revealScreen">
                <div class="eyebrow">She said it</div>
                <h1>I love you ❤️</h1>
                <p class="sub" style="margin-top:6px;">Here's something just for you...</p>

                <!-- Video shows up automatically based on VIDEO_URL set near the top of the script below -->
                <div id="videoWrap"></div>
                <p class="video-hint" id="videoHint">
                    🎬 Add your video: set <code>VIDEO_URL</code> near the top of the script to a
                    YouTube link or a direct .mp4 file link.
                </p>
            </div>

        </div>
    </div>

    <div id="crier"><span class="face">😢</span>
        <div class="bubble" id="crierBubble">wait, no!</div>
    </div>

    <script>
        (function () {
            "use strict";

            /* ====================================================
               EDIT ME: personalize the messages here
               ==================================================== */
            const teaseMessages = [
                "Choose wisely...",
                "Are you sure? 👀",
                "That button is camera-shy...",
                "It really doesn't want to be clicked 😅",
                "Come on, just say yes 🥺",
                "It's getting tired of running...",
                "Okay but 'No' is really scared of you now",
                "Statistically, 'Yes' is the better click 📊",
                "Last chance to make it easy on yourself 💗"
            ];

            const cryLines = [
                "wait, no!", "don't leave me!", "come back!", "I'm scared now 😢", "please don't 🥹"
            ];

            /* ====================================================
               EDIT ME: paste a YouTube link, a Vimeo link, or a
               direct video file URL (e.g. "myvideo.mp4"). Leave as
               "" to show the "add your video" hint instead.
               ==================================================== */
            const VIDEO_URL = "https://www.youtube.com/watch?v=RYZLKmIdyxs";

            let dodgeCount = 0;

            const askScreen = document.getElementById('askScreen');
            const revealScreen = document.getElementById('revealScreen');
            const card = document.getElementById('card');
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const btnRow = document.getElementById('btnRow');
            const subtext = document.getElementById('subtext');
            const attemptsText = document.getElementById('attemptsText');
            const crier = document.getElementById('crier');
            const crierBubble = document.getElementById('crierBubble');

            /* ---------------- floating hearts background ---------------- */
            const heartsWrap = document.getElementById('hearts');
            const heartEmojis = ['💗', '💖', '💕', '💓', '🌸'];
            function spawnHeart() {
                const h = document.createElement('div');
                h.className = 'float-heart';
                h.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                const left = Math.random() * 100;
                const duration = 8 + Math.random() * 7;
                const drift = (Math.random() * 80 - 40) + 'px';
                h.style.left = left + 'vw';
                h.style.setProperty('--drift', drift);
                h.style.animationDuration = duration + 's';
                h.style.fontSize = (1 + Math.random() * 1.2) + 'rem';
                heartsWrap.appendChild(h);
                setTimeout(() => h.remove(), duration * 1000 + 200);
            }
            for (let i = 0; i < 6; i++) setTimeout(spawnHeart, i * 600);
            setInterval(spawnHeart, 900);

            /* ---------------- dodging "No" button ---------------- */
            let noRoaming = false;
            let noRect = { w: 0, h: 0 };

            function lockRectSize() {
                const r = noBtn.getBoundingClientRect();
                noRect.w = r.width;
                noRect.h = r.height;
            }

            function moveNoButton() {
                if (revealScreen.classList.contains('show')) return;
                lockRectSize();

                const margin = 12;
                const maxX = window.innerWidth - noRect.w - margin;
                const maxY = window.innerHeight - noRect.h - margin;

                let x = margin + Math.random() * Math.max(0, maxX - margin);
                let y = margin + Math.random() * Math.max(0, maxY - margin);

                if (!noRoaming) {
                    noBtn.classList.add('roaming');
                    noRoaming = true;
                }
                noBtn.style.left = x + 'px';
                noBtn.style.top = y + 'px';

                dodgeCount++;
                updateAfterDodge();
                triggerCry();
            }

            function updateAfterDodge() {
                // grow the yes button gently, cap the growth
                const scale = Math.min(1 + dodgeCount * 0.035, 1.6);
                card.style.setProperty('--yes-scale', scale.toFixed(3));

                const msg = teaseMessages[Math.min(dodgeCount, teaseMessages.length - 1)];
                subtext.textContent = msg;

                if (dodgeCount > 0) {
                    attemptsText.textContent = "attempts to click 'No': " + dodgeCount;
                }
            }

            // desktop: dodge on hover
            noBtn.addEventListener('mouseenter', moveNoButton);

            // mobile: dodge on touch/pointer start, before the tap can land
            noBtn.addEventListener('touchstart', function (e) {
                e.preventDefault();
                moveNoButton();
            }, { passive: false });

            noBtn.addEventListener('pointerdown', function (e) {
                if (e.pointerType === 'touch') {
                    moveNoButton();
                }
            });

            // safety net: if it somehow gets clicked anyway, show the crying character
            noBtn.addEventListener('click', function (e) {
                e.preventDefault();
                moveNoButton();
            });

            window.addEventListener('resize', function () {
                if (noRoaming) moveNoButton();
            });

            /* ---------------- crying character ---------------- */
            let cryTimer = null;
            let cryMoveInterval = null;

            function triggerCry() {
                crierBubble.textContent = cryLines[Math.floor(Math.random() * cryLines.length)];
                crier.classList.add('show');

                if (cryMoveInterval) clearInterval(cryMoveInterval);
                moveCrier();
                cryMoveInterval = setInterval(moveCrier, 700);

                if (cryTimer) clearTimeout(cryTimer);
                cryTimer = setTimeout(function () {
                    crier.classList.remove('show');
                    clearInterval(cryMoveInterval);
                }, 2600);
            }

            function moveCrier() {
                const margin = 40;
                const w = window.innerWidth, h = window.innerHeight;
                const x = margin + Math.random() * (w - margin * 2);
                const y = margin + Math.random() * (h - margin * 2);
                crier.style.left = x + 'px';
                crier.style.top = y + 'px';
            }

            /* ---------------- yes button ---------------- */
            yesBtn.addEventListener('click', function () {
                askScreen.style.display = 'none';
                revealScreen.classList.add('show');
                if (cryMoveInterval) clearInterval(cryMoveInterval);
                if (cryTimer) clearTimeout(cryTimer);
                crier.classList.remove('show');
                dropCharacters();
                burstHearts();
                checkVideo(); // video <source> link/placeholder logic is untouched below
            });

            function dropCharacters() {
                const layer = document.createElement('div');
                layer.className = 'dropfall';
                document.body.appendChild(layer);
                const faces = ['😢', '😭', '🥲'];
                const count = 14;
                for (let i = 0; i < count; i++) {
                    const s = document.createElement('span');
                    s.textContent = faces[Math.floor(Math.random() * faces.length)];
                    s.style.left = (Math.random() * 94) + 'vw';
                    s.style.animationDuration = (1.4 + Math.random() * 1.1) + 's';
                    s.style.animationDelay = (Math.random() * 0.5) + 's';
                    s.style.setProperty('--spin', (Math.random() * 360 - 180) + 'deg');
                    s.style.fontSize = (1.4 + Math.random() * 1) + 'rem';
                    layer.appendChild(s);
                }
                setTimeout(() => layer.remove(), 2800);
            }

            function burstHearts() {
                const layer = document.createElement('div');
                layer.className = 'burst';
                document.body.appendChild(layer);
                const emojis = ['❤️', '💖', '💗', '🌸', '✨'];
                for (let i = 0; i < 26; i++) {
                    const s = document.createElement('span');
                    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 120 + Math.random() * 220;
                    s.style.setProperty('--bx', Math.cos(angle) * dist + 'px');
                    s.style.setProperty('--by', Math.sin(angle) * dist + 'px');
                    s.style.left = (50 + (Math.random() * 20 - 10)) + 'vw';
                    s.style.top = (45 + (Math.random() * 20 - 10)) + 'vh';
                    layer.appendChild(s);
                }
                setTimeout(() => layer.remove(), 1300);
            }

            /* ---------------- video embed builder ---------------- */
            function getYouTubeId(url) {
                const patterns = [
                    /youtu\.be\/([A-Za-z0-9_-]{6,})/,
                    /youtube\.com\/watch\?v=([A-Za-z0-9_-]{6,})/,
                    /youtube\.com\/embed\/([A-Za-z0-9_-]{6,})/,
                    /youtube\.com\/shorts\/([A-Za-z0-9_-]{6,})/
                ];
                for (const p of patterns) {
                    const m = url.match(p);
                    if (m) return m[1];
                }
                return null;
            }

            function getVimeoId(url) {
                const m = url.match(/vimeo\.com\/(\d+)/);
                return m ? m[1] : null;
            }

            function checkVideo() {
                const wrap = document.getElementById('videoWrap');
                const hint = document.getElementById('videoHint');
                const url = (VIDEO_URL || '').trim();

                if (!url) {
                    wrap.innerHTML = '';
                    hint.style.display = 'block';
                    return;
                }

                hint.style.display = 'none';
                const ytId = getYouTubeId(url);
                const vimeoId = getVimeoId(url);

                if (ytId) {
                    const params = 'rel=0&modestbranding=1&iv_load_policy=3&playsinline=1';
                    wrap.innerHTML =
                        '<div class="embed-16x9"><iframe src="https://www.youtube.com/embed/' + ytId + '?' + params +
                        '" title="video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>';
                } else if (vimeoId) {
                    wrap.innerHTML =
                        '<div class="embed-16x9"><iframe src="https://player.vimeo.com/video/' + vimeoId +
                        '" title="video" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>';
                } else {
                    // treat as a direct video file (e.g. .mp4)
                    wrap.innerHTML =
                        '<div class="embed-16x9"><video controls playsinline src="' + url + '"></video></div>';
                }
            }

        })();
    </script>
</body>

</html>
